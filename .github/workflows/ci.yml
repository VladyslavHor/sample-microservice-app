name: CI Backend Services

on:
    push:
        branches: ["master", "dev"]
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    pull_request:
        branches: ["master", "dev"]
    workflow_dispatch:

jobs:
    build-backend:
        name: Build & Push ${{ matrix.service }} image
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service: [cart, catalog, orders, checkout, assets]

        permissions:
            id-token: write # for OIDC
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-central-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build & Push "${{ matrix.service }}" image
              run: |
                  chmod +x ./scripts/build-image.sh

                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  SHA_TAG="${{ github.sha }}"
                  IMAGE_NAME="retail-store-sample-${{ matrix.service }}"

                  echo "Building and pushing ${{ matrix.service }} image..."
                  ./scripts/build-image.sh \
                    --service "${{ matrix.service }}" \
                    --repository $ECR_REGISTRY \
                    --tag $SHA_TAG \
                    --push

                    # If we're on 'master' branch, also tag as 'latest'
                  if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                    echo "Tagging image as 'latest' ..."
                    aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
                    docker pull $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG
                    docker tag $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG $ECR_REGISTRY/$IMAGE_NAME:latest
                    docker push $ECR_REGISTRY/$IMAGE_NAME:latest
                  else
                    echo "Not master branch — skipping 'latest' tag"
                  fi

                  echo "Image pushed:"
                  echo " - $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG"
                  [[ "${{ github.ref }}" == "refs/heads/master" ]] || [[ "${{ github.ref }}" == refs/tags/* ]] && echo " - $ECR_REGISTRY/$IMAGE_NAME:latest" || true

    save-sha:
        name: Save SHA for CD
        runs-on: ubuntu-latest
        needs: build-backend
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Save SHA for CD
              run: echo "${{ github.sha }}" > image_sha.txt

            - name: Upload SHA artifact
              uses: actions/upload-artifact@v4
              with:
                  name: image-sha
                  path: image_sha.txt
