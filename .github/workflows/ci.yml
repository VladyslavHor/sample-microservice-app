name: CI Backend Services

on:
    push:
        branches: ["main", "dev"]
    pull_request:
        branches: ["main", "dev"]
    workflow_dispatch:

jobs:
    build-catalog:
        name: Build catalog service
        runs-on: ubuntu-latest

        permissions:
            id-token: write # for OIDC
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-central-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build & Push catalog image (SHA + latest)
              run: |
                  chmod +x ./scripts/build-image.sh

                  ECR_REPO="${{ steps.login-ecr.outputs.registry }}"
                  SERVICE_NAME="catalog"
                  SHA_TAG="${{ github.sha }}"
                  LATEST_TAG="latest"

                  echo "🛠️ Building image for $SERVICE_NAME ..."
                  ./scripts/build-image.sh \
                    --service $SERVICE_NAME \
                    --repository $ECR_REPO \
                    --tag $SHA_TAG \
                    --push

                  echo "🔁 Tagging image as 'latest' ..."
                  docker pull $ECR_REPO/$SERVICE_NAME:$SHA_TAG
                  docker tag $ECR_REPO/$SERVICE_NAME:$SHA_TAG $ECR_REPO/$SERVICE_NAME:$LATEST_TAG
                  docker push $ECR_REPO/$SERVICE_NAME:$LATEST_TAG

                  echo "✅ Image pushed:"
                  echo " - $ECR_REPO/$SERVICE_NAME:$SHA_TAG"
                  echo " - $ECR_REPO/$SERVICE_NAME:$LATEST_TAG"
