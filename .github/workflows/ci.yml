name: CI Backend Services

on:
    push:
        branches: ["master", "dev"]
    pull_request:
        branches: ["master", "dev"]
    workflow_dispatch:

jobs:
    build-catalog:
        name: Build catalog service
        runs-on: ubuntu-latest

        permissions:
            id-token: write # for OIDC
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-central-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build & Push catalog image
              run: |
                  chmod +x ./scripts/build-image.sh

                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  SHA_TAG="${{ github.sha }}"
                  IMAGE_NAME="retail-store-sample-catalog"

                  echo "Building and pushing image..."
                  ./scripts/build-image.sh \
                    --service catalog \
                    --repository $ECR_REGISTRY \
                    --tag $SHA_TAG \
                    --push

                    # If we're on 'master' branch, also tag as 'latest'
                  if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                    echo "Tagging image as 'latest' ..."
                    aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
                    docker pull $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG
                    docker tag $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG $ECR_REGISTRY/$IMAGE_NAME:latest
                    docker push $ECR_REGISTRY/$IMAGE_NAME:latest
                  else
                    echo "Not master branch — skipping 'latest' tag"
                  fi

                  echo "Image pushed:"
                  echo " - $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG"
                  [[ "${{ github.ref }}" == "refs/heads/master" ]] && echo " - $ECR_REGISTRY/$IMAGE_NAME:latest" || true
