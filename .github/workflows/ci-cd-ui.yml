name: CI/CD Frontend (UI)

on:
    push:
        branches:
            - master
            - dev
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:
        inputs:
            sha:
                description: "SHA для деплою (залишити пустим для останнього build)"
                required: false
                default: ""

jobs:
    build-ui:
        name: Build & Push UI image
        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-central-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build & Push UI image
              run: |
                  chmod +x ./scripts/build-image.sh

                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  SHA_TAG="${{ github.sha }}"
                  IMAGE_NAME="retail-store-sample-ui"

                  echo "Building and pushing UI image..."
                  ./scripts/build-image.sh \
                    --service "ui" \
                    --repository $ECR_REGISTRY \
                    --tag $SHA_TAG \
                    --push

                  if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                    echo "Tagging image as 'latest'..."
                    aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
                    docker pull $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG
                    docker tag $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG $ECR_REGISTRY/$IMAGE_NAME:latest
                    docker push $ECR_REGISTRY/$IMAGE_NAME:latest
                  fi

            - name: Save SHA for CD
              if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
              run: echo "${{ github.sha }}" > image_sha.txt

            - name: Upload SHA artifact
              if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
              uses: actions/upload-artifact@v4
              with:
                  name: image-sha
                  path: image_sha.txt

    deploy-ui:
        name: Deploy UI to ECS
        runs-on: ubuntu-latest
        needs: build-ui

        permissions:
            id-token: write
            contents: read

        if: >
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'push'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-central-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Download SHA artifact (manual deploy)
              if: github.event_name == 'workflow_dispatch' && github.event.inputs.sha == ''
              uses: actions/download-artifact@v4
              with:
                  name: image-sha
                  path: ./sha-artifact

            - name: Set deploy SHA
              id: set-sha
              run: |
                  if [[ -n "${{ github.event.inputs.sha }}" ]]; then
                    echo "DEPLOY_SHA=${{ github.event.inputs.sha }}" >> $GITHUB_ENV
                  else
                    DEPLOY_SHA=$(cat ./sha-artifact/image_sha.txt)
                    echo "DEPLOY_SHA=$DEPLOY_SHA" >> $GITHUB_ENV
                  fi

            - name: Deploy UI image to ECS
              run: |
                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  IMAGE_NAME="retail-store-sample-ui"
                  ECS_CLUSTER="microservice-infra-default"
                  ECS_SERVICE="ui-service-svc"

                  echo "Deploying $IMAGE_NAME with SHA $DEPLOY_SHA to ECS service: $ECS_SERVICE"
                  aws ecs update-service \
                    --cluster "$ECS_CLUSTER" \
                    --service "$ECS_SERVICE" \
                    --force-new-deployment \
                    --image "$ECR_REGISTRY/$IMAGE_NAME:$DEPLOY_SHA"
