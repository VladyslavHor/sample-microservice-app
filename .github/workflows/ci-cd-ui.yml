name: CI/CD Frontend (UI)

on:
    push:
        branches:
            - master
            - dev
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:
        inputs:
            sha:
                description: "SHA to deploy (leave blank for 'last' build)"
                required: false
                default: ""

jobs:
    build-ui:
        name: Build & Push UI image
        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-central-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build & Push UI image
              run: |
                  chmod +x ./scripts/build-image.sh

                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  SHA_TAG="${{ github.sha }}"
                  IMAGE_NAME="retail-store-sample-ui"

                  echo "Building and pushing UI image..."
                  ./scripts/build-image.sh \
                    --service "ui" \
                    --repository $ECR_REGISTRY \
                    --tag $SHA_TAG \
                    --push

                  if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                    echo "Tagging image as 'latest'..."
                    aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
                    docker pull $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG
                    docker tag $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG $ECR_REGISTRY/$IMAGE_NAME:latest
                    docker push $ECR_REGISTRY/$IMAGE_NAME:latest
                  fi

            - name: Save SHA for CD
              if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
              run: echo "${{ github.sha }}" > image_sha.txt

            - name: Upload SHA artifact
              if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
              uses: actions/upload-artifact@v4
              with:
                  name: image-sha
                  path: image_sha.txt

    deploy-ui:
        name: Deploy UI to ECS
        runs-on: ubuntu-latest
        needs: build-ui

        permissions:
            id-token: write
            contents: read

        if: >
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'push'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-central-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Download SHA artifact (manual deploy)
              if: github.event_name == 'workflow_dispatch' && github.event.inputs.sha == ''
              uses: actions/download-artifact@v4
              with:
                  name: image-sha
                  path: ./sha-artifact

            - name: Set deploy SHA
              id: set-sha
              run: |
                  if [[ -n "${{ github.event.inputs.sha }}" ]]; then
                    # Use SHA, provided as input
                    echo "DEPLOY_SHA=${{ github.event.inputs.sha }}" >> $GITHUB_ENV
                  elif [[ -f ./sha-artifact/image_sha.txt ]]; then
                    # Take SHA from artifact last CI
                    DEPLOY_SHA=$(cat ./sha-artifact/image_sha.txt)
                    echo "DEPLOY_SHA=$DEPLOY_SHA" >> $GITHUB_ENV
                  else
                    # Fallback: take SHA from current commit
                    echo "DEPLOY_SHA=${GITHUB_SHA}" >> $GITHUB_ENV
                  fi

            - name: Deploy UI image to ECS
              run: |
                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  IMAGE="$ECR_REGISTRY/retail-store-sample-ui:$DEPLOY_SHA"
                  ECS_CLUSTER="microservice-infra-default"
                  ECS_SERVICE="ui-service-svc"
                  TASK_DEFINITION_NAME="ui-task"
                  TASK_DEF_JSON=$(mktemp)

                  echo "Generating new task definition with image $IMAGE..."
                  aws ecs describe-task-definition \
                    --task-definition $ECS_SERVICE \
                    --query 'taskDefinition' > $TASK_DEF_JSON

                  # Update container image and remove read-only fields
                  jq ".containerDefinitions[0].image=\"$IMAGE\" |
                      del(.status, .revision, .taskDefinitionArn, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)" \
                      $TASK_DEF_JSON > "${TASK_DEF_JSON}.new"

                  NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
                    --cli-input-json file://${TASK_DEF_JSON}.new \
                    --query 'taskDefinition.taskDefinitionArn' \
                    --output text)

                  echo "Deploying UI service with new task definition $NEW_TASK_DEF_ARN..."
                  aws ecs update-service \
                    --cluster $ECS_CLUSTER \
                    --service $ECS_SERVICE \
                    --task-definition $NEW_TASK_DEF_ARN \
                    --force-new-deployment
