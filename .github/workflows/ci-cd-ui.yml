name: CI/CD Frontend (UI)

on:
    push:
        branches:
            - master
            - dev
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:
        inputs:
            sha:
                description: "SHA to deploy (leave blank for 'last' build)"
                required: false
                default: ""

jobs:
    build-ui:
        name: Build & Push UI image
        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-central-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build & Push UI image
              run: |
                  chmod +x ./scripts/build-image.sh
                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  IMAGE_NAME="retail-store-sample-ui"
                  SHA_TAG="${{ github.sha }}"

                  echo "Building and pushing UI image..."
                  ./scripts/build-image.sh --service "ui" --repository $ECR_REGISTRY --tag $SHA_TAG --push

                  # Tag as 'latest' on master branch or for version tags
                  if [[ "${GITHUB_REF}" == "refs/heads/master" ]] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                      echo "Tagging image as 'latest'..."
                      docker tag $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG $ECR_REGISTRY/$IMAGE_NAME:latest
                      docker push $ECR_REGISTRY/$IMAGE_NAME:latest
                  fi

    deploy-ui:
        name: Deploy UI to ECS
        runs-on: ubuntu-latest
        needs: build-ui

        permissions:
            id-token: write
            contents: read

        if: >
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'push'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-central-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Deploy UI image to ECS
              run: |
                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  IMAGE="$ECR_REGISTRY/retail-store-sample-ui:latest"
                  ECS_CLUSTER="microservice-infra-default"
                  ECS_SERVICE="ui-service-svc"

                  echo "Deploying $IMAGE to ECS service: $ECS_SERVICE"
                  aws ecs update-service \
                    --cluster $ECS_CLUSTER \
                    --service $ECS_SERVICE \
                    --force-new-deployment
