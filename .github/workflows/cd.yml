name: CD Backend Services

on:
    workflow_run:
        workflows: ["CI Backend Services"]
        types:
            - completed

    workflow_dispatch:
        inputs:
            service:
                description: "Specify service to deploy (cart, catalog, orders, checkout, assets, or all)"
                required: false
                default: "all"

    push:
        branches:
            - dev

env:
    AWS_REGION: eu-central-1
    ECS_CLUSTER: my-ecs-cluster
    SERVICES: '["cart","catalog","orders","checkout","assets"]'

jobs:
    deploy:
        name: Deploy backend services
        runs-on: ubuntu-latest

        if: >
            (
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.conclusion == 'success'
            ) || (
              github.event_name == 'workflow_dispatch' &&
              (
                github.event.inputs.service == 'all' ||
                contains(fromJson('["cart","catalog","orders","checkout","assets"]'), github.event.inputs.service)
              )
            ) || (
              github.event_name == 'push' &&
              github.ref == 'refs/heads/dev'
            )

        strategy:
            matrix:
                service: [cart, catalog, orders, checkout, assets]

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Conditional deploy check
              if: >
                  github.event_name == 'workflow_dispatch' &&
                  github.event.inputs.service != 'all' &&
                  matrix.service != github.event.inputs.service
              run: echo "Skipping ${{ matrix.service }} (manual deploy for another service)"

            - name: Deploy to ECS
              if: >
                  github.event_name == 'workflow_run' ||
                  github.event_name == 'push' ||
                  github.event.inputs.service == 'all' ||
                  github.event.inputs.service == matrix.service
              run: |
                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  IMAGE_NAME="retail-store-sample-${{ matrix.service }}"
                  IMAGE_TAG="latest"

                  if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
                    IMAGE_TAG="dev"
                  fi

                  echo "Deploying $IMAGE_NAME:$IMAGE_TAG to ECS..."
                  aws ecs update-service \
                    --cluster ${{ env.ECS_CLUSTER }} \
                    --service ${{ matrix.service }} \
                    --force-new-deployment

                  echo "$IMAGE_NAME:$IMAGE_TAG deployment triggered successfully"
