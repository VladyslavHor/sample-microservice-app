name: CD Backend Services

on:
    workflow_run:
        workflows: ["CI Backend Services"]
        types:
            - completed

    workflow_dispatch:
        inputs:
            service:
                description: "all" # deploy all services, or specify one: cart, catalog, orders, checkout, assets
                required: false
                default: "all"

jobs:
    deploy:
        name: Deploy backend services
        runs-on: ubuntu-latest

        if: >
            (
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.conclusion == 'success'
            ) || (
              github.event_name == 'workflow_dispatch' &&
              (
                github.event.inputs.service == 'all' ||
                contains(fromJson('["cart","catalog","orders","checkout","assets"]'), github.event.inputs.service)
              )
            )

        strategy:
            matrix:
                service: [cart, catalog, orders, checkout, assets]

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-central-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Conditional deploy check
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.service != 'all' && matrix.service != github.event.inputs.service }}
              run: echo "Skipping ${{ matrix.service }} (manual deploy for another service)"

            - name: Deploy to ECS
              if: ${{ github.event_name == 'workflow_run' || github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service }}
              run: |
                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  IMAGE_NAME="retail-store-sample-${{ matrix.service }}"

                  echo "Pulling image $IMAGE_NAME:latest..."
                  docker pull $ECR_REGISTRY/$IMAGE_NAME:latest

                  echo "Updating ECS service for $IMAGE_NAME..."
                  aws ecs update-service \
                    --cluster my-ecs-cluster \
                    --service ${{ matrix.service }} \
                    --force-new-deployment
