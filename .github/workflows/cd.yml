name: CD Backend Services

on:
    workflow_run:
        workflows: ["CI Backend Services"]
        types:
            - completed

    workflow_dispatch:
        inputs:
            service:
                description: "Specify service name (cart, catalog, orders, checkout, assets) or 'all' to deploy all"
                required: false
                default: "all"

env:
    AWS_REGION: eu-central-1
    ECS_CLUSTER: microservice-infra-default
    SERVICES: '["cart","catalog","orders","checkout","assets"]'

jobs:
    deploy:
        name: Deploy backend services
        runs-on: ubuntu-latest

        if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch') }}

        strategy:
            matrix:
                service: [cart, catalog, orders, checkout, assets]

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Validate ECS cluster exists
              run: |
                  echo "🔍 Checking if ECS cluster '${{ env.ECS_CLUSTER }}' exists..."
                  CLUSTER_STATUS=$(aws ecs describe-clusters \
                    --clusters ${{ env.ECS_CLUSTER }} \
                    --query 'clusters[0].status' \
                    --output text \
                    --region ${{ env.AWS_REGION }})

                  if [[ "$CLUSTER_STATUS" != "ACTIVE" ]]; then
                    echo "ECS cluster '${{ env.ECS_CLUSTER }}' not found or inactive (status: $CLUSTER_STATUS)"
                    exit 1
                  fi
                  echo "ECS cluster '${{ env.ECS_CLUSTER }}' is ACTIVE"

            - name: Conditional deploy check
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.service != 'all' && matrix.service != github.event.inputs.service }}
              run: echo "Skipping ${{ matrix.service }} (manual deploy for another service)"

            - name: Deploy to ECS
              if: ${{ github.event_name == 'workflow_run' || github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service }}
              run: |
                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  SERVICE="${{ matrix.service }}"
                  IMAGE_NAME="retail-store-sample-$SERVICE"
                  ECS_SERVICE="${SERVICE}-service-svc"

                  echo "Deploying $IMAGE_NAME:latest to ECS service: $ECS_SERVICE"

                  # Check if the ECS service exists
                  SERVICE_EXISTS=$(aws ecs describe-services \
                    --cluster ${{ env.ECS_CLUSTER }} \
                    --services "$ECS_SERVICE" \
                    --query 'failures[0].reason' \
                    --output text \
                    --region ${{ env.AWS_REGION }})

                  if [[ "$SERVICE_EXISTS" == "MISSING" ]]; then
                    echo "ECS service '$ECS_SERVICE' not found in cluster '${{ env.ECS_CLUSTER }}'. Skipping..."
                    exit 0
                  fi

                  echo "ECS service '$ECS_SERVICE' exists, continuing deployment..."

                  # Update the ECS service to use the new image
                  aws ecs update-service \
                    --cluster ${{ env.ECS_CLUSTER }} \
                    --service "$ECS_SERVICE" \
                    --force-new-deployment \
                    --region ${{ env.AWS_REGION }}

                  echo "Successfully triggered new deployment for $ECS_SERVICE"
