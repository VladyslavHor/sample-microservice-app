name: Deploy to EC2

on:
    push:
        branches:
            - main
            - dev
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
        paths:
            - "go-server/docker-compose.yml"

    workflow_dispatch:
        branches:
            - main
            - dev

env:
    EC2_HOST: api.vh.gzttk.org
    EC2_USER: ec2-user

jobs:
    deploy:
        name: Upload and Trigger Compose on EC2
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Upload docker-compose.yml to EC2
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ env.EC2_HOST }}
                  username: ${{ env.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  source: "go-server/docker-compose.yml"
                  target: "/home/${{ env.EC2_USER }}/deploy/"
                  strip_components: 1

            - name: Run custom watcher on EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ env.EC2_HOST }}
                  username: ${{ env.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      cd ~/deploy
                      ./watch_compose.sh
